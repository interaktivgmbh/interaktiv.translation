[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interaktiv.translation"
version = "1.0.0a1"
description = "Machine translation for Plone content with DeepL."
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [
    { name = "Interaktiv GmbH", email = "info@interaktiv.de" },
]
keywords = ["CMS", "Plone", "Python", "DeepL", "translation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: 6.0",
    "Framework :: Plone :: 6.1",
    "Framework :: Plone :: Addon",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Plone",
    "cryptography",
    "plone.api",
    "plone.app.iterate",
    "plone.app.multilingual",
    "plone.restapi",
    "requests",
]

[project.urls]
Homepage = "https://github.com/interaktivgmbh/interaktiv.translation"
Source = "https://github.com/interaktivgmbh/interaktiv.translation"
Tracker = "https://github.com/interaktivgmbh/interaktiv.translation/issues"

[project.optional-dependencies]
test = ["plone.app.testing"]
i18n = ["i18ndude"]

[project.entry-points."plone.autoinclude.plugin"]
target = "plone"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
# `.pt` belongs here as much as `.zcml` does: the Classic view is a page
# template, and a wheel without it fails at ZCML parsing rather than at first
# use — the whole Zope instance refuses to start. An editable install reads the
# source tree and hides that, which is why it only shows in a deployment.
"*" = ["*.zcml", "*.xml", "*.pot", "*.po", "*.mo", "*.pt", "*.txt", "*.cfg"]
